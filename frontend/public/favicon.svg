<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Omnix-AI">
  <!--
    An Omnitrix-style dial: dark casing, green face, black hourglass.

    Four solid shapes, no gradients or blur filters, because a favicon is
    usually painted at 16px. Fine detail disappears at that size while still
    costing bytes, so the design rests entirely on the silhouette — a bright
    ring around a dark hourglass stays readable in a crowded tab strip.
  -->

  <!-- Casing -->
  <circle cx="32" cy="32" r="31" fill="#10161f"/>

  <!-- Bezel: the ring is what makes the shape read as a dial rather than a dot -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#233040" stroke-width="4"/>

  <!-- Face, in the violet the app already uses for its buttons and logo.
       Violet-500 rather than the deeper violet-600 of the gradient's end: at
       600 the dark hourglass falls to roughly 3:1 against it and starts to
       muddy at small sizes, while this holds about 4.5:1. -->
  <circle cx="32" cy="32" r="23" fill="#8b5cf6"/>

  <!-- Hourglass, with straight edges so it stays crisp when scaled down -->
  <path d="M19 13 H45 L36.5 32 L45 51 H19 L27.5 32 Z" fill="#0b1017"/>
</svg>
